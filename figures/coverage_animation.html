<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>DFL Coverage — Animated Comparison</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
    }

    canvas {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.7);
      max-width: 98vw;
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <script>
    'use strict';

    // ── Physical data ─────────────────────────────────────────────────────────────
    const NODES = [
      [0.0000, 3.4544],  // 0
      [0.8128, 0.0000],  // 1
      [4.0386, 0.3302],  // 2
      [4.9276, 2.0320],  // 3
      [8.1280, 0.7239],  // 4
      [8.1280, 3.9624],  // 5
      [1.1684, 7.6835],  // 6
      [4.1656, 6.4262],  // 7
      [5.2070, 6.3246],  // 8
      [6.7564, 7.65],  // 9
    ];
    const RW = 8.5, RH = 8.2;

    // Active-colour RGB for each config (matches badge colour)
    const LRGB = [
      [220, 38, 38],   // #dc2626  Config A — red
      [234, 88, 12],   // #ea580c  Config B — orange
      [22, 163, 74],   // #16a34a  Config C — green
    ];

    const CONFIGS = [
      {
        label: 'POOR COVERAGE', lc: '#dc2626', title: 'Config A — Clustered Links',
        links: [[1, 4], [2, 4], [3, 4], [1, 3], [2, 3]]
      },
      {
        label: 'MEDIUM COVERAGE', lc: '#ea580c', title: 'Config B — Parallel Links',
        links: [[6, 9], [0, 5], [1, 4], [7, 3], [8, 4]]
      },
      {
        label: 'GOOD COVERAGE', lc: '#16a34a', title: 'Config C — Spatially Diverse',
        links: [[6, 4], [1, 9], [0, 5], [6, 2], [9, 2]]
      },
    ];

    // ── Grid (discretisation of monitored area) ───────────────────────────────────
    const GN = 20;
    const GRID = [];
    for (let iy = 0; iy < GN; iy++)
      for (let ix = 0; ix < GN; ix++)
        GRID.push([0.25 + (RW - 0.5) * ix / (GN - 1), 0.25 + (RH - 0.5) * iy / (GN - 1)]);

    const LAMBDA = 0.40;
    const d2 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

    // Pre-compute incremental coverage waves: WAVES[c][l] = grid indices newly covered
    const WAVES = CONFIGS.map(cfg => {
      const cov = new Uint8Array(GRID.length);
      return cfg.links.map(([i, j]) => {
        const p1 = NODES[i], p2 = NODES[j];
        const dL = d2(p1, p2);
        const mid = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
        const w = [];
        for (let g = 0; g < GRID.length; g++)
          if (!cov[g] && d2(GRID[g], p1) + d2(GRID[g], p2) <= dL + LAMBDA) { cov[g] = 1; w.push(g); }
        w.sort((a, b) => d2(GRID[a], mid) - d2(GRID[b], mid));
        return w;
      });
    });

    // ── Canvas ────────────────────────────────────────────────────────────────────
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const CW = 1380, CH = 620;
    cv.width = CW; cv.height = CH;

    // ── Layout ────────────────────────────────────────────────────────────────────
    const TH = 46;                    // global title
    const LH = 52;                    // legend footer
    const PH = CH - TH - LH;         // panel height ≈ 522
    const GAP = 14, MAR = 20;
    const PW = Math.floor((CW - 2 * MAR - 2 * GAP) / 3);  // ≈ 437

    const HDR = 50;    // badge + config title space inside panel (subtitle removed)
    const FTR = 42;    // coverage bar + text
    const PAD = 22;    // inner room padding

    const SC = Math.min(
      (PW - 2 * PAD) / RW,
      (PH - HDR - FTR - 2 * PAD) / RH
    );
    const RPW = RW * SC, RPH = RH * SC;
    const RLO = PAD + (PW - 2 * PAD - RPW) / 2;
    const RTO = HDR + PAD;

    function pLeft(c) { return MAR + c * (PW + GAP); }

    function R2C(rx, ry, c) {
      return [pLeft(c) + RLO + rx * SC,
      TH + RTO + (RH - ry) * SC];
    }

    // ── Roundrect polyfill ────────────────────────────────────────────────────────
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        this.beginPath();
        this.moveTo(x + r, y); this.lineTo(x + w - r, y);
        this.arcTo(x + w, y, x + w, y + r, r); this.lineTo(x + w, y + h - r);
        this.arcTo(x + w, y + h, x + w - r, y + h, r); this.lineTo(x + r, y + h);
        this.arcTo(x, y + h, x, y + h - r, r); this.lineTo(x, y + r);
        this.arcTo(x, y, x + r, y, r); this.closePath();
      };
    }

    // ── Animation timing ──────────────────────────────────────────────────────────
    const LS = 1.1, LD = 0.45, FD = 0.50, WD = 0.95, HOLD = 2.8;
    const CYCLE = 1.0 + 5 * LS + HOLD;

    function TK(l) {
      const s = 1.0 + l * LS;
      return { ls: s, le: s + LD, fs: s + 0.20, fe: s + 0.20 + FD, ws: s + LD, we: s + LD + WD };
    }

    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const ease = t => 1 - (1 - t) ** 2.5;
    const prog = (t, t0, t1) => ease(clamp((t - t0) / (t1 - t0), 0, 1));

    // ── Draw helpers ──────────────────────────────────────────────────────────────
    function drawRoom(c) {
      const [ox, oy] = R2C(0, RH, c);
      ctx.fillStyle = '#f8f8f8'; ctx.strokeStyle = '#555'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.rect(ox, oy, RPW, RPH); ctx.stroke(); ctx.fill();
    }

    function drawGrid(c, green) {
      const sz = 4.0;
      for (let g = 0; g < GRID.length; g++) {
        const [gx, gy] = R2C(GRID[g][0], GRID[g][1], c);
        const f = green[g];
        const r = Math.round(212 + f * (65 - 212));
        const gr = Math.round(212 + f * (171 - 212));
        const b = Math.round(212 + f * (93 - 212));
        ctx.fillStyle = `rgb(${r},${gr},${b})`;
        ctx.fillRect(gx - sz / 2, gy - sz / 2, sz, sz);
      }
    }

    function drawFresnel(c, i, j, alpha) {
      if (alpha <= 0.01) return;
      const p1 = NODES[i], p2 = NODES[j];
      const dL = d2(p1, p2);
      const a = (dL + LAMBDA) / 2;
      const bx = Math.sqrt(Math.max(a * a - (dL / 2) ** 2, 0));
      const ang = -Math.atan2(p2[1] - p1[1], p2[0] - p1[0]);
      const [cx, cy] = R2C((p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2, c);
      const [ox, oy] = R2C(0, RH, c);
      ctx.save();
      ctx.beginPath(); ctx.rect(ox, oy, RPW, RPH); ctx.clip();
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(ang);
      ctx.beginPath(); ctx.ellipse(0, 0, a * SC, bx * SC, 0, 0, Math.PI * 2);
      ctx.globalAlpha = alpha * 0.18; ctx.fillStyle = '#756bb1'; ctx.fill();
      ctx.globalAlpha = alpha * 0.65; ctx.strokeStyle = '#756bb1';
      ctx.lineWidth = 0.9; ctx.setLineDash([5, 3]); ctx.stroke();
      ctx.restore(); ctx.restore();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }

    function drawLink(c, i, j, frac) {
      if (frac <= 0) return;
      const [x1, y1] = R2C(NODES[i][0], NODES[i][1], c);
      const [x2, y2] = R2C(NODES[j][0], NODES[j][1], c);
      const xm = x1 + frac * (x2 - x1), ym = y1 + frac * (y2 - y1);
      ctx.strokeStyle = '#111'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(xm, ym); ctx.stroke();
      if (frac > 0.06) {
        const ang = Math.atan2(ym - y1, xm - x1), as = Math.min(9, frac * 13);
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.moveTo(xm, ym);
        ctx.lineTo(xm - as * Math.cos(ang - 0.38), ym - as * Math.sin(ang - 0.38));
        ctx.lineTo(xm - as * Math.cos(ang + 0.38), ym - as * Math.sin(ang + 0.38));
        ctx.closePath(); ctx.fill();
      }
    }

    // Fully uniform: same operations executed for every node every frame.
    // activeFrac 0→1: radius 5→7, border 0.8→2.3 px. No branches, no alpha changes.
    function drawNode(c, n, activeFrac) {
      const [x, y] = R2C(NODES[n][0], NODES[n][1], c);
      const rad = 7.5; // Slightly larger, fixed size

      // Interpolate from dark red to dark green
      const dr = 180, dg = 0, db = 0;
      const gr = 0, gg = 128, gb = 0;

      const r = Math.round(dr + activeFrac * (gr - dr));
      const g = Math.round(dg + activeFrac * (gg - dg));
      const b = Math.round(db + activeFrac * (gb - db));

      // Solid filled node
      ctx.globalAlpha = 1;
      ctx.fillStyle = `rgb(${r},${g},${b})`;

      // Border
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1.5; // Constant border

      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.closePath();

      // Fill first, then border
      ctx.fill();
      ctx.stroke();

      // Node label
      ctx.fillStyle = `rgb(${Math.round(r * 0.45)},${Math.round(g * 0.45)},${Math.round(b * 0.45)})`;
      ctx.font = `bold 18px sans-serif`; // Constant label font
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText(String(n), x + rad + 4, y - 2);
    }
    // Badge + config title (subtitle removed, fonts enlarged)
    function drawBadge(c, cfg) {
      const bx = pLeft(c) + PW / 2;
      const by = TH + 17;
      ctx.save();
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const tw = ctx.measureText(cfg.label).width + 26;
      ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.strokeStyle = cfg.lc; ctx.lineWidth = 1.8;
      
      ctx.beginPath(); // The crucial fix for Node 9
      ctx.roundRect(bx - tw / 2, by - 14, tw, 28, 7); ctx.stroke(); ctx.fill();
      
      ctx.fillStyle = cfg.lc; ctx.fillText(cfg.label, bx, by);
      ctx.font = 'bold 15px serif'; ctx.fillStyle = '#1a202c';
      ctx.fillText(cfg.title, bx, TH + 44);
      ctx.restore();
    }

    function drawCovBar(c, cfg, covN) {
      const px = pLeft(c);
      const barY = TH + PH - FTR + 8;
      const barW = PW - 2 * PAD;
      const barX = px + PAD;
      const pct = covN / GRID.length;
      ctx.fillStyle = '#e2e8f0'; ctx.beginPath();
      ctx.roundRect(barX, barY, barW, 16, 8); ctx.fill();
      if (pct > 0) {
        ctx.fillStyle = cfg.lc; ctx.beginPath();
        ctx.roundRect(barX, barY, barW * pct, 16, 8); ctx.fill();
      }
      ctx.fillStyle = '#1a202c'; ctx.font = '16px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(
        `Coverage = ${Math.round(pct * 100)}%   (${covN} / ${GRID.length} grid points)`,
        px + PW / 2, barY + 22
      );
    }

    function drawLegend() {
      const ly = CH - LH + 8;
      const items = [
        { tp: 'circle2', co1: '#b40000', co2: '#008000', tx: 'Sensor node  (turns green when activated)' },
        { tp: 'line', co: '#111', tx: 'Active link  (budget = 5)' },
        { tp: 'ellipse', co: '#756bb1', tx: 'Fresnel zone' },
        { tp: 'square', co: '#41ab5d', tx: 'Covered grid point' },
        { tp: 'square', co: '#d4d4d4', tx: 'Uncovered grid point' },
      ];
      
      // Calculate dynamic positions so they don't overlap when fonts are large
      ctx.font = '16px serif';
      const spacing = 35;
      let totalW = 0;
      items.forEach(item => {
        totalW += (item.tp === 'circle2' ? 46 : 24) + ctx.measureText(item.tx).width + spacing;
      });
      totalW -= spacing;
      
      let currentX = (CW - totalW) / 2; // Center the whole legend!

      items.forEach(({ tp, co, co1, co2, tx }, k) => {
        const ix = currentX, iy = ly + 18;
        ctx.save();
        if (tp === 'circle2') {
          // left: normal node  right: activated (same size)
          ctx.fillStyle = co1; ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(ix + 7, iy, 7.5, 0, Math.PI * 2); ctx.stroke(); ctx.fill();
          ctx.fillStyle = '#666'; ctx.font = '11px sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('→', ix + 21, iy);
          // active node: green
          ctx.fillStyle = co2; ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(ix + 35, iy, 7.5, 0, Math.PI * 2); ctx.stroke(); ctx.fill();
        } else if (tp === 'line') {
          ctx.strokeStyle = co; ctx.lineWidth = 1.8;
          ctx.beginPath(); ctx.moveTo(ix, iy); ctx.lineTo(ix + 18, iy); ctx.stroke();
          ctx.fillStyle = co;
          ctx.beginPath(); ctx.moveTo(ix + 18, iy);
          ctx.lineTo(ix + 11, iy - 3.5); ctx.lineTo(ix + 11, iy + 3.5);
          ctx.closePath(); ctx.fill();
        } else if (tp === 'ellipse') {
          ctx.globalAlpha = 0.5; ctx.fillStyle = co; ctx.strokeStyle = co;
          ctx.lineWidth = 0.8; ctx.setLineDash([3, 2]);
          ctx.beginPath(); ctx.ellipse(ix + 9, iy, 11, 6.5, 0, 0, Math.PI * 2);
          ctx.stroke(); ctx.fill(); ctx.setLineDash([]);
        } else {
          ctx.fillStyle = co; ctx.fillRect(ix, iy - 6, 14, 12);
        }
        ctx.restore(); ctx.globalAlpha = 1;
        ctx.fillStyle = '#333'; ctx.font = '16px serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(tx, ix + (tp === 'circle2' ? 46 : 24), iy);
        
        currentX += (tp === 'circle2' ? 46 : 24) + ctx.measureText(tx).width + spacing;
      });
    }

    // ── Main render loop ──────────────────────────────────────────────────────────
    let t0 = null;

    function frame(ts) {
      if (!t0) t0 = ts;
      const T = ((ts - t0) / 1000) % CYCLE;

      ctx.clearRect(0, 0, CW, CH);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, CW, CH);

      // Global title
      ctx.fillStyle = '#1a202c'; ctx.font = 'bold 24px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(
        'Deployment Coverage: Same Budget (5 Active Links) — Three Configurations',
        CW / 2, TH / 2
      );

      CONFIGS.forEach((cfg, c) => {
        const px = pLeft(c);
        const inc = WAVES[c];
        const [ar, ag, ab] = LRGB[c];

        // Panel background
        ctx.fillStyle = '#f0f4f8'; ctx.fillRect(px, TH, PW, PH);

        // Room
        drawRoom(c);

        // Build green array + node activation fractions
        const green = new Float32Array(GRID.length);
        const nodeActive = new Float32Array(NODES.length);
        let covN = 0;

        for (let l = 0; l < cfg.links.length; l++) {
          const { ls, le, ws, we } = TK(l);

          // Node activation: starts when the link begins drawing
          const lp = prog(T, ls, le);
          if (lp > 0) {
            const [ni, nj] = cfg.links[l];
            nodeActive[ni] = Math.max(nodeActive[ni], lp);
            nodeActive[nj] = Math.max(nodeActive[nj], lp);
          }

          // Grid coverage wave
          if (T >= ws) {
            const wt = clamp((T - ws) / (we - ws), 0, 1);
            const wave = inc[l];
            const N = wave.length;
            for (let k = 0; k < N; k++) {
              const thr = (k / N) * 0.82;
              const gf = ease(clamp((wt - thr) / 0.18, 0, 1));
              if (gf > green[wave[k]]) green[wave[k]] = gf;
            }
          }
        }
        for (let g = 0; g < GRID.length; g++) if (green[g] > 0.5) covN++;

        drawGrid(c, green);

        // Fresnel zones
        for (let l = 0; l < cfg.links.length; l++) {
          const { fs, fe } = TK(l);
          drawFresnel(c, cfg.links[l][0], cfg.links[l][1], prog(T, fs, fe));
        }
        // Links
        for (let l = 0; l < cfg.links.length; l++) {
          const { ls, le } = TK(l);
          drawLink(c, cfg.links[l][0], cfg.links[l][1], prog(T, ls, le));
        }
        // Nodes — colour driven by nodeActive
        for (let n = 0; n < NODES.length; n++)
          drawNode(c, n, nodeActive[n]);

        drawBadge(c, cfg);
        drawCovBar(c, cfg, covN);
      });

      drawLegend();

      // White flash between cycles
      const fo = ease(clamp((T - (CYCLE - 0.6)) / 0.6, 0, 1));
      const fi = ease(clamp(1 - T / 0.45, 0, 1));
      const fa = Math.max(fo, fi);
      if (fa > 0.01) {
        ctx.globalAlpha = fa; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, CW, CH);
        ctx.globalAlpha = 1;
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>

</html>
